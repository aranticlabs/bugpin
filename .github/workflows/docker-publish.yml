name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*.*.*' # Matches both production (v1.0.0) and dev (v1.0.0-dev) tags
  workflow_dispatch: # Allows manual triggering

env:
  HARBOR_REGISTRY: registry.arantic.cloud
  HARBOR_PROJECT: bugpin
  IMAGE_NAME: bugpin

jobs:
  age-policy:
    uses: ./.github/workflows/dependency-age-policy.yml
    permissions:
      contents: read
      actions: read
    secrets:
      EE_ACCESS_TOKEN: ${{ secrets.EE_ACCESS_TOKEN }}

  build-and-push:
    needs: age-policy
    runs-on: ubuntu-latest
    # Runs on: version tags only (v1.0.0 for production, v1.0.0-dev for development)
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          submodules: true
          token: ${{ secrets.EE_ACCESS_TOKEN }}
          persist-credentials: false

      - name: Check if dev or beta tag
        id: check
        run: |
          if [[ "${{ github.ref_name }}" == *-dev || "${{ github.ref_name }}" == *-beta* ]]; then
            echo "is_dev=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify CE and EE
        run: |
          bun run typecheck
          bun run test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Harbor Registry (Production)
        if: steps.check.outputs.is_dev == 'false'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ vars.HARBOR_ROBOT }}
          password: ${{ secrets.HARBOR_KEY }}

      - name: Log in to Harbor Registry (Dev/Stage)
        if: steps.check.outputs.is_dev == 'true'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.HARBOR_REGISTRY }}
          username: ${{ vars.HARBOR_ROBOT_DEV }}
          password: ${{ secrets.HARBOR_KEY_DEV }}

      # Floating tags (1.3, latest) only move forward. Without this, publishing an older
      # release again, or a patch for an older release line, would point them at an older
      # version. If the check itself fails, all floating tags are moved as before.
      - name: Decide which floating tags this release may move
        id: floating
        if: steps.check.outputs.is_dev == 'false'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git ls-remote --tags --refs "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" 'v*' \
            | sed 's#.*refs/tags/##' \
            | bun run src/server/scripts/floating-image-tags.ts "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.HARBOR_REGISTRY }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            # For production tags (v1.0.0) -> 1.0.0, plus the floating tags 1.0 and latest
            type=semver,pattern={{version}},enable=${{ steps.check.outputs.is_dev == 'false' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.check.outputs.is_dev == 'false' && steps.floating.outputs.minor != 'false' }}
            type=raw,value=latest,enable=${{ steps.check.outputs.is_dev == 'false' && steps.floating.outputs.latest != 'false' }}
            # For dev/beta tags (v1.0.1-dev, v1.0.1-beta.1) -> <version>, dev
            type=match,pattern=v(.*),group=1,enable=${{ steps.check.outputs.is_dev == 'true' }}
            type=raw,value=dev,enable=${{ steps.check.outputs.is_dev == 'true' }}
          labels: |
            org.opencontainers.image.title=BugPin
            org.opencontainers.image.description=Self-hosted bug reporting and feedback widget
            org.opencontainers.image.vendor=Arantic Digital

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Prepare shared image metadata
        env:
          METADATA_JSON: ${{ steps.meta.outputs.json }}
        run: |
          bun -e '
            const metadata = JSON.parse(process.env.METADATA_JSON);
            const tags = metadata.tags.map(tag => tag.slice(tag.lastIndexOf(":") + 1));
            const output = `IMAGE_TAGS=${JSON.stringify(tags)}\nIMAGE_LABELS=${JSON.stringify(metadata.labels)}\n`;
            await Bun.write(process.env.GITHUB_ENV, await Bun.file(process.env.GITHUB_ENV).text() + output);
          '

      - name: Build and push Docker images
        id: build
        uses: docker/bake-action@v6
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        with:
          source: .
          files: docker-bake.hcl
          push: true

      - name: Image metadata
        env:
          BUILD_METADATA: ${{ steps.build.outputs.metadata }}
        run: printf '%s\n' "$BUILD_METADATA"
