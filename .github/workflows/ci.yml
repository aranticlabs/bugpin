name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:
  workflow_call:
    secrets:
      EE_ACCESS_TOKEN:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run format:check

  knip:
    name: knip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout CE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check unused files and dependencies
        run: bun run knip

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pull requests from forks get no secrets; EE checks are skipped there
      HAS_EE_ACCESS: ${{ secrets.EE_ACCESS_TOKEN != '' }}
    steps:
      - name: Checkout CE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve pinned EE revision
        id: ee-revision
        run: echo "sha=$(git rev-parse --verify HEAD:ee)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned EE
        if: env.HAS_EE_ACCESS == 'true'
        uses: actions/checkout@v4
        with:
          repository: aranticlabs/bugpin-ee
          ref: ${{ steps.ee-revision.outputs.sha }}
          token: ${{ secrets.EE_ACCESS_TOKEN }}
          path: ee
          persist-credentials: false

      - name: Note skipped EE checks
        if: env.HAS_EE_ACCESS != 'true'
        run: echo "::notice::EE_ACCESS_TOKEN is not available, so the EE typecheck is skipped."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Pull requests from forks get no secrets; EE checks are skipped there
      HAS_EE_ACCESS: ${{ secrets.EE_ACCESS_TOKEN != '' }}
    steps:
      - name: Checkout CE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Resolve pinned EE revision
        id: ee-revision
        run: echo "sha=$(git rev-parse --verify HEAD:ee)" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned EE
        if: env.HAS_EE_ACCESS == 'true'
        uses: actions/checkout@v4
        with:
          repository: aranticlabs/bugpin-ee
          ref: ${{ steps.ee-revision.outputs.sha }}
          token: ${{ secrets.EE_ACCESS_TOKEN }}
          path: ee
          persist-credentials: false

      - name: Note skipped EE checks
        if: env.HAS_EE_ACCESS != 'true'
        run: echo "::notice::EE_ACCESS_TOKEN is not available, so the EE tests are skipped."

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        run: bun run test

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout CE
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check widget bundle size
        run: bun run src/widget/scripts/check-bundle-size.ts
