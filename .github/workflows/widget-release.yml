name: Create Widget GitHub Release

on:
  push:
    tags:
      - 'widget-v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Load widget changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#widget-v}"
          CHANGELOG_FILE="Changelog/widget/v${VERSION}.md"
          if [ ! -f "$CHANGELOG_FILE" ]; then
            echo "::error::No widget changelog found at $CHANGELOG_FILE"
            exit 1
          fi
          PREVIOUS_TAG=$(git tag --sort=-v:refname | grep -E '^widget-v[0-9]+\.[0-9]+\.[0-9]+$' | grep -vx "$TAG" | head -n 1 || true)

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo "body<<CHANGELOG_EOF"
            # Skip the first line (# Widget Changelog vX.Y.Z header); the release name replaces it
            tail -n +2 "$CHANGELOG_FILE"
            echo ""
            echo "---"
            echo "**npm**: https://www.npmjs.com/package/@arantic/bugpin-widget/v/$VERSION"
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "**Compare**: https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_TAG}...${TAG}"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: BugPin Widget ${{ steps.changelog.outputs.version }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: false
          # The app release stays marked as the latest release of the repository
          make_latest: false
