name: Dependency Release Age

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  age-policy:
    uses: ./.github/workflows/dependency-age-policy.yml
    secrets:
      EE_ACCESS_TOKEN: ${{ secrets.EE_ACCESS_TOKEN }}
