name: CE and EE Dependency Age Policy

on:
  workflow_call:
    secrets:
      EE_ACCESS_TOKEN:
        required: false

permissions:
  contents: read
  actions: read

jobs:
  validate:
    name: Check dependency ages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      approval_required: ${{ steps.scope.outputs.check == 'none' && 'false' || steps.age.outputs.approval_required }}
    steps:
      - name: Checkout exact CE revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select dependency checks
        id: scope
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          check=all
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            changes=$(git diff --name-only "$PR_BASE_SHA" HEAD -- \
              bun.lock bun.lockb package.json ':(glob)**/package.json' \
              bunfig.toml ':(glob)**/bunfig.toml' .npmrc ':(glob)**/.npmrc' \
              ee .gitmodules .github/workflows \
              src/server/scripts/check-dependency-age.ts tests/server/dependency-age.test.ts)
            if [ -z "$changes" ]; then
              check=none
            else
              ee_changes=$(git diff --name-only "$PR_BASE_SHA" HEAD -- ee .gitmodules)
              if [ -z "$ee_changes" ]; then check=ce; fi
            fi
          fi
          echo "check=$check" >> "$GITHUB_OUTPUT"
          if [ "$check" = none ]; then
            echo "Dependency inputs unchanged; no release age check required." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify EE access
        if: steps.scope.outputs.check == 'all'
        env:
          EE_ACCESS_TOKEN: ${{ secrets.EE_ACCESS_TOKEN }}
        run: |
          if [ -z "$EE_ACCESS_TOKEN" ]; then
            echo "::error::EE_ACCESS_TOKEN is required to verify the private EE lockfile. Fork contributions that change the EE revision must be checked from a trusted maintainer branch."
            exit 1
          fi

      - name: Resolve pinned EE revision
        id: ee-revision
        if: steps.scope.outputs.check == 'all'
        run: |
          sha=$(git rev-parse --verify HEAD:ee)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Checkout pinned EE lockfile
        if: steps.scope.outputs.check == 'all'
        uses: actions/checkout@v4
        with:
          repository: aranticlabs/bugpin-ee
          ref: ${{ steps.ee-revision.outputs.sha }}
          token: ${{ secrets.EE_ACCESS_TOKEN }}
          path: ee
          persist-credentials: false
          sparse-checkout: bun.lock
          sparse-checkout-cone-mode: false

      - name: Set up Bun
        if: steps.scope.outputs.check != 'none'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.4'

      - name: Test release age checks
        if: steps.scope.outputs.check != 'none'
        run: bun test tests/server/dependency-age.test.ts

      - name: Check dependency release age
        id: age
        if: steps.scope.outputs.check != 'none'
        shell: bash
        env:
          EE_SHA: ${{ steps.ee-revision.outputs.sha }}
          CHECK_SCOPE: ${{ steps.scope.outputs.check }}
        run: |
          set -euo pipefail
          {
            echo "## CE and EE dependency age review"
            echo
            echo "CE: $GITHUB_SHA"
            echo
            if [ "$CHECK_SCOPE" = all ]; then
              echo "EE: $EE_SHA"
            else
              echo "EE revision unchanged; checking CE dependencies only."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          lockfiles=(bun.lock)
          if [ "$CHECK_SCOPE" = all ]; then lockfiles+=(ee/bun.lock); fi
          bun run src/server/scripts/check-dependency-age.ts "${lockfiles[@]}" --request-approval

      - name: Verify admin approval protection
        if: steps.age.outputs.approval_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/dependency-age-override" --jq '
            [.protection_rules[] | select(.type == "required_reviewers") | .reviewers[]]
            | if length > 0 and all(.[]; .type == "User")
              then .[].reviewer.login
              else error("The age override environment must require repository admin reviewers") end')
          for reviewer in $reviewers; do
            permission=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$reviewer/permission" --jq '.permission')
            if [ "$permission" != admin ]; then
              echo "::error::The age override reviewer $reviewer is not a repository admin."
              exit 1
            fi
          done

  approve-young-releases:
    name: Approve age exception
    needs: validate
    if: needs.validate.outputs.approval_required == 'true'
    runs-on: ubuntu-latest
    environment:
      name: dependency-age-override
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#summary
    steps:
      - name: Record age exception for this run
        env:
          APPROVED_SHA: ${{ github.sha }}
        run: echo "Admin-approved release age exception for CE $APPROVED_SHA and its pinned EE revision in this workflow run."

  enforce:
    name: Dependency policy
    needs: [validate, approve-young-releases]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Summarize dependency policy
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
          APPROVAL_REQUIRED: ${{ needs.validate.outputs.approval_required }}
          APPROVAL_RESULT: ${{ needs.approve-young-releases.result }}
        run: |
          status=0
          if [ "$VALIDATION_RESULT" != success ]; then
            message="Dependency validation did not succeed ($VALIDATION_RESULT). Review the Check dependency ages job. For a download or network failure, rerun failed jobs. Age exceptions cannot waive validation errors."
            status=1
          elif [ "$APPROVAL_REQUIRED" = false ]; then
            message="Dependency ages passed. No age exception was needed."
          elif [ "$APPROVAL_REQUIRED" = true ] && [ "$APPROVAL_RESULT" = success ]; then
            message="Dependency ages verified. An administrator approved the age exception for this revision."
          elif [ "$APPROVAL_REQUIRED" = true ]; then
            message="The age exception was not approved ($APPROVAL_RESULT). Rerun failed jobs to request approval again, then use Review deployments in this workflow run."
            status=1
          else
            message="Dependency validation did not report whether approval was required. Review the Check dependency ages job and rerun failed jobs."
            status=1
          fi
          printf '## Dependency policy\n\n%s\n' "$message" >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            echo "::error::$message"
          fi
          exit "$status"
