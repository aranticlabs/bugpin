# BugPin with Docker Compose: docker compose up -d
# Access: http://localhost:7300
# First login defaults: admin@example.com / changeme123.
# The initial password works once; BugPin asks for a new one after the first login.
# Update: docker compose pull && docker compose up -d
# Optional settings such as the image tag: copy .env.example to .env.
# Enable the dedicated portal frontend: docker compose --profile separate-portal up -d
# Set Portal Base URL to its HTTPS origin in the Admin Console.

x-frontend: &frontend
  restart: unless-stopped
  environment:
    BUGPIN_PUBLIC_SCHEME: ${BUGPIN_PUBLIC_SCHEME:-http}
    BUGPIN_RESOLVER: ${BUGPIN_RESOLVER:-127.0.0.11}
    BUGPIN_TRUSTED_PROXIES: ${BUGPIN_TRUSTED_PROXIES:-}
  volumes:
    - bugpin-proxy:/run/bugpin:ro
  depends_on:
    bugpin-server:
      condition: service_healthy
      restart: true

services:
  bugpin-server:
    container_name: bugpin-server
    image: registry.arantic.cloud/bugpin/bugpin-server:${BUGPIN_TAG:-latest}
    restart: unless-stopped
    environment:
      # Set to debug for verbose logging (default: info).
      LOG_LEVEL: info
      # Initial admin account, used only when no users exist yet.
      # ADMIN_EMAIL: admin@example.com
      # ADMIN_PASSWORD: choose-a-strong-initial-password
      # Ignore Enforce HTTPS temporarily to recover without a TLS proxy.
      # Remove this override after correcting the setting.
      # DISABLE_HTTPS_ENFORCEMENT: 'true'
      PORT: '4300'
      HOST: 0.0.0.0
      DATA_DIR: /data
      TRUST_PROXY: token
      PROXY_TOKEN_FILE: /run/bugpin/proxy-token
    expose:
      - '4300'
    volumes:
      - ./data:/data
      - bugpin-proxy:/run/bugpin
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:4300/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  bugpin-admin:
    <<: *frontend
    container_name: bugpin-admin
    image: registry.arantic.cloud/bugpin/bugpin-admin:${BUGPIN_TAG:-latest}
    ports:
      - '7300:7300'
    # Traefik: route to this frontend, keeping the server port private.
    # Set BUGPIN_PUBLIC_SCHEME=https and BUGPIN_TRUSTED_PROXIES to Traefik's IP/CIDR.
    # Publish on 127.0.0.1 or remove ports when using a shared proxy network.
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.bugpin.rule=Host(`bugpin.yourdomain.com`)"
    #   - "traefik.http.routers.bugpin.entrypoints=websecure"
    #   - "traefik.http.routers.bugpin.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.bugpin.loadbalancer.server.port=7300"
    # networks:
    #   - default
    #   - traefik
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:7300/admin-health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  bugpin-portal:
    <<: *frontend
    container_name: bugpin-portal
    image: registry.arantic.cloud/bugpin/bugpin-portal:${BUGPIN_TAG:-latest}
    profiles:
      - separate-portal
    ports:
      - '7310:7310'
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://127.0.0.1:7310/portal-health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  bugpin-proxy:

# Uncomment when using an external Traefik network. Add the portal frontend to it too
# and give it its own router and service on port 7310 when enabling separate-portal.
# networks:
#   traefik:
#     external: true
