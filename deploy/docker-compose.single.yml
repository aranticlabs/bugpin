# BugPin - Self-hosted Bug Reporting & Feedback Widget
# https://github.com/aranticlabs/bugpin
#
# Quick start:
#   Copy this file as docker-compose.yml into an empty directory, then run:
#   docker compose up -d
#
# Access: http://localhost:7300
# First login: ADMIN_EMAIL / ADMIN_PASSWORD below (defaults: admin@example.com / changeme123).
# The initial password works once; BugPin asks for a new one after the first login.
#
# Update:
#   docker compose pull && docker compose up -d

services:
  bugpin:
    image: registry.arantic.cloud/bugpin/bugpin:latest
    container_name: bugpin
    restart: unless-stopped
    ports:
      - '7300:7300'
    volumes:
      - ./data:/data
      # Alternative: use named volume
      # - bugpin-data:/data
    environment:
      # Set to "debug" for verbose logging (default: info)
      - LOG_LEVEL=info
      # Initial admin account, used only when no users exist yet
      # - ADMIN_EMAIL=admin@example.com
      # - ADMIN_PASSWORD=choose-a-strong-initial-password
      # Which proxies may set X-Forwarded-For: auto (loopback and private networks, default
      # when unset), true (any proxy) or false (none). This quick start publishes port 7300
      # without a proxy, so forwarded headers are ignored. Switch to auto behind a reverse
      # proxy such as the Traefik example below.
      - TRUST_PROXY=false
      # Ignore the "Enforce HTTPS" setting, for example after it locked you out without a TLS
      # proxy. Remove it again once the setting is turned off.
      # - DISABLE_HTTPS_ENFORCEMENT=true
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:7300/health']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

    # Traefik reverse proxy example (uncomment to use, and set TRUST_PROXY=auto above)
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.bugpin.rule=Host(`bugpin.yourdomain.com`)"
    #   - "traefik.http.routers.bugpin.entrypoints=websecure"
    #   - "traefik.http.routers.bugpin.tls.certresolver=letsencrypt"
    #   - "traefik.http.services.bugpin.loadbalancer.server.port=7300"
    # networks:
    #   - traefik

# Uncomment if using Traefik or external network
# networks:
#   traefik:
#     external: true

# Uncomment if using named volumes
# volumes:
#   bugpin-data:
